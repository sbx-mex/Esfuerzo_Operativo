name: Auditar y limpiar obsoletos

on:
  push:
    branches: [main]
    paths:
      - "scripts/cleanup_obsolete.py"
      - "scripts/obsolete-files.json"
      - ".github/workflows/cleanup-obsolete.yml"
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: Escribe ELIMINAR para aplicar; cualquier otro valor solo audita
        required: false
        default: AUDITAR

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Auditar alcance
        run: python scripts/cleanup_obsolete.py

      - name: Eliminar únicamente lo autorizado
        if: ${{ github.event_name == 'push' || inputs.confirm_delete == 'ELIMINAR' }}
        run: |
          python scripts/cleanup_obsolete.py --apply
          python scripts/cleanup_obsolete.py --check-clean

      - name: Registrar limpieza
        if: ${{ github.event_name == 'push' || inputs.confirm_delete == 'ELIMINAR' }}
        run: |
          if git diff --quiet; then
            echo "No hay obsoletos presentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .
          git commit -m "chore: eliminar obsoletos autorizados"
          git push
