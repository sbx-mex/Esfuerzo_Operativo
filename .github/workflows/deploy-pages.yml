name: Publicar PWA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Sincronizar motores operativos"]
    types: [completed]
  workflow_dispatch:

# IMPORTANTE: Settings > Pages > Build and deployment debe usar "GitHub Actions".
# Publicar desde main/(root) sirve /src/main.tsx sin compilar y deja la pantalla en blanco.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          # workflow_run inicia con el SHA que disparó la sincronización. Al
          # terminar, el bot ya publicó el JSON nuevo en la rama principal.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Validar origen de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          build_type=$(python -c 'import json,sys; print(json.load(sys.stdin).get("build_type", "legacy"))' <<<"${response}")
          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages está en Deploy from a branch. Cambia Settings > Pages > Source a GitHub Actions; publicar main/(root) deja la pantalla en blanco."
            exit 1
          fi

      - name: Instalar y validar
        run: |
          npm ci
          npm run check
          npm run build
          python scripts/audit_release.py --dist

      - name: Confirmar artefacto compilado
        run: |
          test -f dist/index.html
          test -f dist/data/dashboard.json
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::El artefacto todavía apunta al código fuente TSX."
            exit 1
          fi
          repository_name="${GITHUB_REPOSITORY#*/}"
          grep -q "/${repository_name}/assets/" dist/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
